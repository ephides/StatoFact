# Konfiguration des statofact-agent (nur root lesbar).
# Der Agent meldet erst, wenn URL und Token gesetzt sind.

# active sendet regelmäßig; passive stellt Daten nur per SSH-Abruf bereit.
STATOFACT_MODE=active
# Basis-URL von Statofact, z. B. http://10.0.0.40:3000
STATOFACT_URL=
# Token (= AGENT_TOKEN des Servers)
STATOFACT_TOKEN=
# Optional: CI-Name (Standard: Hostname)
#STATOFACT_NAME=
# Optional: vollständiger Pfad zur VirtualBox.xml eines Benutzers.
#STATOFACT_VIRTUALBOX_REGISTRY=/home/user/.config/VirtualBox/VirtualBox.xml
# Optional: Verzeichnis mit VMware-Workstation-.vmx-Dateien (rekursiv).
#STATOFACT_VMWARE_DIRECTORY=/home/user/vmware
